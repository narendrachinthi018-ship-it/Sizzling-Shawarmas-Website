kind = "web"
previewPath = "/"
title = "Sizzling Shawarmas & Biryanis"
description = "A premium, mobile-first restaurant ordering website for Sizzling Shawarmas & Biryanis in Kukatpally, Hyderabad, with menu browsing, cart management, WhatsApp ordering, reviews, gallery, and location details."
version = "1.0.0"
id = "artifacts/sizzling-shawarmas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19935

[services.development]
run = "pnpm --filter @workspace/sizzling-shawarmas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sizzling-shawarmas", "run", "build" ]
serve = "static"
publicDir = "artifacts/sizzling-shawarmas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19935"
BASE_PATH = "/"
